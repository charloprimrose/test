<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperNight — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #d6d6de;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo ── */
    .logo-area {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3vh 0 1.5vh;
      height: 16vh;
    }

    .logo-area img {
      max-height: 100%;
      max-width: 40vw;
      object-fit: contain;
      /* Invert white logo for light background */
      filter: invert(1) brightness(0.15);
    }

    .logo-fallback {
      font-size: clamp(2rem, 5vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #111;
    }

    .logo-fallback span { opacity: 0.25; font-weight: 300; }

    /* ── Cards row ── */
    .cards {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(1rem, 3vw, 3rem);
      padding: 0 4vw 4vh;
      min-height: 0;
    }

    /* ── Outer bezel (matches image's outer rounded rect) ── */
    .card-outer {
      flex: 1;
      max-width: 29vw;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      padding: 10px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.6);
    }

    /* ── Inner card ── */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.5vw, 30px);
    }

    /* Subtle inner gloss at top */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
      border-radius: 24px 24px 0 0;
      pointer-events: none;
    }

    /* ── Lap number row ── */
    .lap-row {
      display: flex;
      align-items: baseline;
      gap: 0.3em;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .lap-number {
      font-size: clamp(3rem, 6.5vw, 7rem);
      font-weight: 900;
      color: #0d0d0d;
      letter-spacing: -0.04em;
      line-height: 1;
      transition: color 0.4s;
    }

    .lap-word {
      font-size: clamp(0.9rem, 1.5vw, 1.7rem);
      font-weight: 700;
      color: #222;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── COMPLETED label ── */
    .completed {
      font-size: clamp(0.7rem, 1.1vw, 1.3rem);
      font-weight: 700;
      font-style: italic;
      color: #444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    /* ── Arc container ── */
    .arc-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0 0;
      min-height: 0;
      position: relative;
    }

    .arc-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      overflow: visible;
    }

    /* Smooth arc fill transition */
    .arc-fill {
      transition: stroke-dasharray 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Connection status */
    #status {
      position: fixed;
      top: 10px; right: 14px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #555;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 10;
    }
    #status.visible { opacity: 0.6; }
    #status.error   { opacity: 1; color: #cc2222; }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-area">
    <img
      src="hypernight.png"
      alt="HyperNight"
      onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';"
    >
    <div class="logo-fallback" id="logo-text" style="display:none;">
      HYPER<span>NIGHT</span>
    </div>
  </div>

  <!-- Cards -->
  <div class="cards">

    <!-- RED -->
    <div class="card-outer">
      <div class="card">
        <div class="lap-row">
          <span class="lap-number" id="num-red">0</span>
          <span class="lap-word">Laps</span>
        </div>
        <div class="completed">Completed</div>
        <div class="arc-wrap">
          <svg class="arc-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Gradient: fades from transparent orange to solid red -->
              <linearGradient id="grad-red" x1="10%" y1="90%" x2="90%" y2="10%">
                <stop offset="0%"   stop-color="#ff8844" stop-opacity="0"/>
                <stop offset="35%"  stop-color="#ff5533" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#cc1111" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <!-- Background track (270° arc) -->
            <circle cx="100" cy="105" r="75"
              stroke="rgba(0,0,0,0.06)"
              stroke-width="12"
              stroke-dasharray="353.4 118"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
            />
            <!-- Progress arc -->
            <circle id="arc-red" cx="100" cy="105" r="75"
              stroke="url(#grad-red)"
              stroke-width="12"
              stroke-dasharray="0 471.2"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
              class="arc-fill"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- GREEN -->
    <div class="card-outer">
      <div class="card">
        <div class="lap-row">
          <span class="lap-number" id="num-green">0</span>
          <span class="lap-word">Laps</span>
        </div>
        <div class="completed">Completed</div>
        <div class="arc-wrap">
          <svg class="arc-svg" viewBox="0 0 200 200" fill="none">
            <defs>
              <linearGradient id="grad-green" x1="10%" y1="90%" x2="90%" y2="10%">
                <stop offset="0%"   stop-color="#aaff88" stop-opacity="0"/>
                <stop offset="35%"  stop-color="#33dd77" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#11aa44" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <circle cx="100" cy="105" r="75"
              stroke="rgba(0,0,0,0.06)"
              stroke-width="12"
              stroke-dasharray="353.4 118"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
            />
            <circle id="arc-green" cx="100" cy="105" r="75"
              stroke="url(#grad-green)"
              stroke-width="12"
              stroke-dasharray="0 471.2"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
              class="arc-fill"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- BLUE -->
    <div class="card-outer">
      <div class="card">
        <div class="lap-row">
          <span class="lap-number" id="num-blue">0</span>
          <span class="lap-word">Laps</span>
        </div>
        <div class="completed">Completed</div>
        <div class="arc-wrap">
          <svg class="arc-svg" viewBox="0 0 200 200" fill="none">
            <defs>
              <linearGradient id="grad-blue" x1="10%" y1="90%" x2="90%" y2="10%">
                <stop offset="0%"   stop-color="#88ccff" stop-opacity="0"/>
                <stop offset="35%"  stop-color="#4499ff" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#1155dd" stop-opacity="1"/>
              </linearGradient>
            </defs>
            <circle cx="100" cy="105" r="75"
              stroke="rgba(0,0,0,0.06)"
              stroke-width="12"
              stroke-dasharray="353.4 118"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
            />
            <circle id="arc-blue" cx="100" cy="105" r="75"
              stroke="url(#grad-blue)"
              stroke-width="12"
              stroke-dasharray="0 471.2"
              stroke-linecap="round"
              transform="rotate(135 100 105)"
              class="arc-fill"
            />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <div id="status">● Live</div>

  <script>
    // r=75 → circumference = 2π×75 ≈ 471.2
    // 270° arc → 471.2 × 0.75 = 353.4
    const R = 75;
    const C = 2 * Math.PI * R;   // 471.2
    const ARC = 0.75 * C;        // 353.4  (270°)

    let state = { red: 0, green: 0, blue: 0, max: 50 };
    const statusEl = document.getElementById('status');

    function updateDisplay(newState) {
      state = newState;
      ['red', 'green', 'blue'].forEach((team) => {
        const pct   = state.max > 0 ? Math.min(1, state[team] / state.max) : 0;
        const filled = pct * ARC;
        const empty  = C - filled;
        document.getElementById(`arc-${team}`).setAttribute(
          'stroke-dasharray', `${filled.toFixed(2)} ${empty.toFixed(2)}`
        );
        document.getElementById(`num-${team}`).textContent = state[team];
      });
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        statusEl.textContent = '● Live';
        statusEl.className = 'visible';
        setTimeout(() => { statusEl.className = ''; }, 2000);
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'init' || msg.type === 'update') updateDisplay(msg.state);
      };

      ws.onclose = () => {
        statusEl.textContent = '⚠ Reconnexion…';
        statusEl.className = 'error visible';
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
