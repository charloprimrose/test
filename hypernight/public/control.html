<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HyperNight — Contrôle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #02020f;
      font-family: 'Inter', system-ui, sans-serif;
      color: #fff;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Aurora background (lighter) */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-base {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 120% 80% at 50% 120%, #08082a 0%, #02020f 70%);
    }

    .aurora-band {
      position: absolute;
      left: -30%;
      width: 160%;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.07;
      mix-blend-mode: screen;
      transition: background 5s ease;
    }

    .band-1 { height: 40vh; top: 0; animation: auroraWave1 12s ease-in-out infinite; }
    .band-2 { height: 30vh; top: 15%; animation: auroraWave2 16s ease-in-out infinite; }

    @keyframes auroraWave1 {
      0%,100% { transform: translateX(0%) skewX(0deg); }
      40%     { transform: translateX(6%) skewX(3deg); }
      70%     { transform: translateX(-4%) skewX(-2deg); }
    }
    @keyframes auroraWave2 {
      0%,100% { transform: translateX(0%); }
      50%     { transform: translateX(-7%); }
    }

    /* Layout */
    .layout {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 10px 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 0 8px;
    }

    header img {
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.15)) brightness(1.1);
    }

    .logo-fallback {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-shadow: 0 0 30px rgba(160,180,255,0.3);
    }

    .logo-fallback span { opacity: 0.3; font-weight: 300; }

    /* Teams grid */
    .teams {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-items: stretch;
    }

    /* Team card */
    .card {
      border-radius: 24px;
      padding: 12px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Frosted glass cards */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* Team-colored bottom glow */
    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 10%; right: 10%;
      height: 1px;
      border-radius: 50%;
      filter: blur(4px);
      opacity: 0.6;
    }

    .card-red::after   { background: #ff5588; box-shadow: 0 0 20px 4px rgba(255,60,120,0.5); }
    .card-green::after { background: #44ffbb; box-shadow: 0 0 20px 4px rgba(0,255,160,0.5); }
    .card-blue::after  { background: #66aaff; box-shadow: 0 0 20px 4px rgba(80,160,255,0.5); }

    /* Team name */
    .team-name {
      position: relative;
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    /* Score */
    .score {
      position: relative;
      font-size: clamp(2.4rem, 8.5vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-red   .score { color: #ffaac8; text-shadow: 0 0 24px rgba(255,80,140,0.6); }
    .card-green .score { color: #aaffdd; text-shadow: 0 0 24px rgba(0,255,180,0.6); }
    .card-blue  .score { color: #bbddff; text-shadow: 0 0 24px rgba(80,180,255,0.6); }

    .score-sub {
      position: relative;
      font-size: 0.6rem;
      font-weight: 300;
      opacity: 0.25;
      letter-spacing: 0.05em;
      margin-top: -4px;
    }

    /* +1 button */
    .btn-plus {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 20px;
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, filter 0.12s;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .btn-plus::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      transition: opacity 0.1s;
    }

    .btn-plus:active { transform: scale(0.93); filter: brightness(1.2); }
    .btn-plus:active::after { opacity: 1; }

    .card-red   .btn-plus {
      background: linear-gradient(135deg, #5a001a, #bb1144, #ff4488);
      box-shadow: 0 6px 28px rgba(255,40,120,0.35), 0 2px 8px rgba(0,0,0,0.4);
    }
    .card-green .btn-plus {
      background: linear-gradient(135deg, #002a14, #008844, #00dd88);
      box-shadow: 0 6px 28px rgba(0,210,130,0.35), 0 2px 8px rgba(0,0,0,0.4);
    }
    .card-blue  .btn-plus {
      background: linear-gradient(135deg, #000d35, #1144bb, #4499ff);
      box-shadow: 0 6px 28px rgba(60,140,255,0.35), 0 2px 8px rgba(0,0,0,0.4);
    }

    /* -1 button */
    .btn-minus {
      position: relative;
      width: 100%;
      padding: 9px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.35);
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, transform 0.12s;
    }

    .btn-minus:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
    }

    /* Footer */
    .footer {
      display: flex;
      gap: 8px;
      padding-top: 10px;
    }

    .btn-reset {
      flex: 1;
      padding: 11px;
      border: 1px solid rgba(255,80,120,0.25);
      border-radius: 14px;
      background: rgba(255,40,80,0.05);
      color: rgba(255,100,140,0.5);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-reset:active { background: rgba(255,40,80,0.15); color: rgba(255,100,140,0.9); }

    .max-control {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 8px 14px;
    }

    .max-control label {
      font-size: 0.65rem;
      opacity: 0.3;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .max-control input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }

    /* Status */
    #status {
      position: fixed;
      top: 8px; right: 12px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 10;
    }
    #status.visible { opacity: 0.4; }
    #status.error   { opacity: 1; color: #ff5588; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 22px;
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="bg">
    <div class="bg-base"></div>
    <div class="aurora-band band-1" id="band1"></div>
    <div class="aurora-band band-2" id="band2"></div>
  </div>

  <div class="layout">
    <header>
      <img
        src="hypernight.png"
        alt="HyperNight"
        onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';"
      >
      <div class="logo-fallback" id="logo-text" style="display:none;">
        HYPER<span>NIGHT</span>
      </div>
    </header>

    <div class="teams">

      <div class="card card-red">
        <div class="team-name">Rouge</div>
        <div class="score" id="score-red">0</div>
        <div class="score-sub" id="max-red">/ 50</div>
        <button class="btn-plus" id="plus-red">+</button>
        <button class="btn-minus" id="minus-red">− 1</button>
      </div>

      <div class="card card-green">
        <div class="team-name">Vert</div>
        <div class="score" id="score-green">0</div>
        <div class="score-sub" id="max-green">/ 50</div>
        <button class="btn-plus" id="plus-green">+</button>
        <button class="btn-minus" id="minus-green">− 1</button>
      </div>

      <div class="card card-blue">
        <div class="team-name">Bleu</div>
        <div class="score" id="score-blue">0</div>
        <div class="score-sub" id="max-blue">/ 50</div>
        <button class="btn-plus" id="plus-blue">+</button>
        <button class="btn-minus" id="minus-blue">− 1</button>
      </div>

    </div>

    <div class="footer">
      <button class="btn-reset" id="btn-reset">Reset</button>
      <div class="max-control">
        <label>Limite</label>
        <input type="number" id="input-max" value="50" min="1" max="999">
      </div>
    </div>
  </div>

  <div id="status">● Live</div>
  <div class="toast" id="toast"></div>

  <script>
    const AURORA = {
      red:   { b1: 'linear-gradient(90deg,transparent,rgba(200,20,60,1),rgba(255,60,100,1),transparent)', b2: 'linear-gradient(90deg,transparent,rgba(180,10,50,1),transparent)' },
      green: { b1: 'linear-gradient(90deg,transparent,rgba(0,180,80,1),rgba(0,255,160,1),transparent)',   b2: 'linear-gradient(90deg,transparent,rgba(0,150,70,1),transparent)' },
      blue:  { b1: 'linear-gradient(90deg,transparent,rgba(30,80,200,1),rgba(80,160,255,1),transparent)', b2: 'linear-gradient(90deg,transparent,rgba(20,60,180,1),transparent)' },
      none:  { b1: 'linear-gradient(90deg,transparent,rgba(60,60,120,1),rgba(80,80,180,1),transparent)',  b2: 'linear-gradient(90deg,transparent,rgba(40,40,100,1),transparent)' },
    };

    let state = { red: 0, green: 0, blue: 0, max: 50 };
    let ws = null;
    let toastTimer = null;
    let currentLeader = 'none';

    const band1 = document.getElementById('band1');
    const band2 = document.getElementById('band2');
    const statusEl = document.getElementById('status');

    function getLeader() {
      const { red, green, blue } = state;
      const max = Math.max(red, green, blue);
      if (max === 0) return 'none';
      if (red === max) return 'red';
      if (green === max) return 'green';
      return 'blue';
    }

    function updateAurora(leader) {
      if (leader === currentLeader) return;
      currentLeader = leader;
      band1.style.background = AURORA[leader].b1;
      band2.style.background = AURORA[leader].b2;
    }

    function renderState(newState) {
      state = newState;
      document.getElementById('input-max').value = state.max;
      ['red', 'green', 'blue'].forEach((t) => {
        document.getElementById(`score-${t}`).textContent = state[t];
        document.getElementById(`max-${t}`).textContent = `/ ${state.max}`;
      });
      updateAurora(getLeader());
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1200);
    }

    ['red', 'green', 'blue'].forEach((team) => {
      document.getElementById(`plus-${team}`).addEventListener('click', () => {
        if (state[team] >= state.max) { showToast('Limite atteinte !'); return; }
        send({ type: 'lap', team, delta: 1 });
      });
      document.getElementById(`minus-${team}`).addEventListener('click', () => {
        if (state[team] <= 0) return;
        send({ type: 'lap', team, delta: -1 });
      });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Réinitialiser tous les compteurs ?')) send({ type: 'reset' });
    });

    document.getElementById('input-max').addEventListener('change', (e) => {
      const val = parseInt(e.target.value);
      if (val > 0) send({ type: 'setMax', max: val });
    });

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);
      ws.onopen = () => {
        statusEl.textContent = '● Live';
        statusEl.className = 'visible';
        setTimeout(() => { statusEl.className = ''; }, 2000);
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'init' || msg.type === 'update') renderState(msg.state);
      };
      ws.onclose = () => {
        statusEl.textContent = '⚠ Reconnexion…';
        statusEl.className = 'error visible';
        setTimeout(connect, 3000);
      };
    }

    updateAurora('none');
    connect();
  </script>
</body>
</html>
